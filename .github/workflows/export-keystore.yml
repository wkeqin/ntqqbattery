# One-shot recovery workflow. Delete this file after downloading the artifact.
name: Export Keystore

on:
  workflow_dispatch:

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "KEYSTORE_BASE64 secret is empty"
            exit 1
          fi
          mkdir -p output
          echo "$KEYSTORE_BASE64" | base64 -d > output/release.jks
          # Keep passwords only inside the private artifact, not CI logs.
          cat > output/signing.properties <<EOF
          signing.storePassword=${{ secrets.STORE_PASSWORD }}
          signing.keyAlias=${{ secrets.KEY_ALIAS }}
          signing.keyPassword=${{ secrets.KEY_PASSWORD }}
          EOF
          ls -la output/release.jks
          # Fingerprint only — no secrets printed
          keytool -list -keystore output/release.jks -storepass "${{ secrets.STORE_PASSWORD }}" 2>/dev/null | sed -n '1,20p' || true

      - name: Upload keystore artifact
        uses: actions/upload-artifact@v7
        with:
          name: ntqqbattery-release-keystore
          path: |
            output/release.jks
            output/signing.properties
          retention-days: 1
